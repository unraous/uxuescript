name: 问题反馈
description: 报告运行异常、课程不兼容或模型请求问题。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先查看[故障排查](https://github.com/unraous/uxuescript/blob/main/docs/troubleshooting.md)及已有 Issue。
        日志和截图请移除密钥、账号与 URL 中的令牌，不要在公开 Issue 中填写登录凭据或上传整份配置文件。
  - type: dropdown
    id: account
    attributes:
      label: 是否方便提供超星账号协助排查？
      description: 部分页面问题需要进入实际课程复现，才能查看页面并定位问题。如方便，请将微信或 QQ 联系方式发送至 unraous@qq.com，维护者会联系你并通过学习通扫码登录，无需提供账号或密码。不方便也可以继续提交反馈，请勿在公开 Issue 中填写登录凭据。
      options:
        - 方便，愿意通过邮件联系并扫码协助
        - 不方便提供
        - 暂不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 客户端或脚本版本
      description: 桌面端查看右下角版本；独立脚本注明下载来源或提交号。
      placeholder: 版本号或 commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 运行方式
      options:
        - 桌面客户端（安装包或便携版）
        - 从源码运行
        - 浏览器独立脚本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与浏览器
      description: 填写系统版本；独立脚本同时填写浏览器名称与版本。
      placeholder: Windows 11 / macOS 版本；Edge 或 Firefox 版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 问题现象与复现步骤
      description: 说明做了什么、期望发生什么、实际停在哪里，以及是否每次出现。
      placeholder: |
        1. 打开……
        2. 点击……
        预期：……
        实际：……
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 相关课程或模型信息
      description: 仅填写与问题有关的项目；页面地址保留域名和路径即可。
      placeholder: |
        课程问题：视频 / PDF / 互动题 / 章节测验，页面域名与路径。
        是否开启倍速或人工核验？最小化才暂停，还是普通切换应用也暂停？
        模型问题：Provider、模型 ID、接口域名与路径、错误码。
  - type: textarea
    id: evidence
    attributes:
      label: 日志与截图
      description: 可粘贴脱敏日志或拖入附件。桌面端通过底部“日志/配置目录”找到 logs，提供同一次运行中出错前后的内容。
